name: Build and test
permissions:
  contents: write
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Upgrade npm to patched lockfile resolver
        run: npm install --global npm@11.21.2
      - name: Upgrade npm to patched lockfile resolver
        run: npm install --global npm@11.21.2
      - name: Regenerate lockfile from declared dependencies
        run: rm -f package-lock.json && npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - name: Audit all dependencies
        run: npm audit --audit-level=high
      - run: npm run test
      - run: npm run build
      - name: Verify GitHub Pages base-path build
        run: npm run build -- --base=/Adine-Poultry-health/
      - run: npm run smoke:supabase
      - run: node --check public/sw.js
      - run: node -e "JSON.parse(require('node:fs').readFileSync('public/manifest.webmanifest', 'utf8'))"
      - name: Commit refreshed package lock
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/feature/ibd-first-mvp'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh npm lockfile'
          git push origin HEAD:${GITHUB_REF_NAME}