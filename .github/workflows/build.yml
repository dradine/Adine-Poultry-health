name: Build and test
permissions:
  contents: read
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Upgrade npm to patched lockfile resolver
        run: npm install --global npm@11.21.2
      - name: Install dependencies and reconcile optional platform packages
        run: npm ci --no-audit --no-fund
      - name: Audit production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high
      - name: Report development-tool advisories (non-blocking)
        run: npm audit --audit-level=high || echo 'Development-tool advisories are reported above; unresolved upstream advisories may not have patched releases.'
      - run: npm run test
      - run: npm run build
      - name: Verify GitHub Pages base-path build
        run: npm run build -- --base=/Adine-Poultry-health/
      - run: npm run smoke:supabase
      - run: node --check public/sw.js
      - run: node -e "JSON.parse(require('node:fs').readFileSync('public/manifest.webmanifest', 'utf8'))"
