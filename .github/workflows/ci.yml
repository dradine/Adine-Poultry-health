name: CI

on:
  push:
    branches:
      - main
      - feature/ibd-first-mvp
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: TypeScript and production build
        run: npm run build
      - name: Supabase public catalog and anonymous-access smoke test
        run: npm run smoke:supabase
