name: Deploy test app to GitHub Pages

on:
  push:
    branches: [feature/ibd-first-mvp]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-test-deploy-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and reconcile optional platform packages
        run: npm install --no-audit --no-fund
      - name: Run tests before preview deployment
        run: npm run test
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build for GitHub Pages project path
        run: npm run build -- --base=/Adine-Poultry-health/
        env:
          GITHUB_PAGES: 'true'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: pages-test-preview
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
